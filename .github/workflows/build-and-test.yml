# P1-005 fix: سير عمل CI — بناء المشروعين وتشغيل اختبارات Stage1
# ملاحظة P1-001: بناء المشروع الرئيس يتطلب مجلد المكاتب الخارجية (المكاتب/)
# غير المتوفر في المستودع؛ لذلك يشغّل البناء الكامل فقط عند توفره، وتبقى
# اختبارات الأمان (مكتبة صرفة) تعمل دائماً.
name: build-and-test

on:
  push:
    branches: [ main, "fix/**", "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  security-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run Stage1 security unit tests
        run: dotnet test tests/SmartAuditERP.SecurityTests/SmartAuditERP.SecurityTests.csproj -c Release --logger "console;verbosity=normal"

  full-build:
    runs-on: windows-latest
    continue-on-error: true # P1-001: المراجع المحلية خارج المستودع — انظر REPAIR-LOG-STAGE1
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (requires external libs — see P1-001)
        run: dotnet build --no-restore -c Release
